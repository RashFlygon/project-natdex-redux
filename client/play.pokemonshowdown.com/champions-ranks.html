<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>NatDex Champions Ranks</title>
	<link rel="stylesheet" href="style/battle.css" />
	<style>
		html, body {
			margin: 0;
			min-height: 100%;
			background: #0c1119;
			color: #f4f8ff;
			font-family: Verdana, Arial, sans-serif;
		}
		body {
			background:
				linear-gradient(180deg, rgba(7, 10, 16, 0.78), rgba(8, 12, 19, 0.92)),
				url("fx/bg-champions-masterball.png") center / cover fixed no-repeat;
		}
		.rank-showcase {
			box-sizing: border-box;
			min-height: 100vh;
			padding: 34px 34px 42px;
			display: grid;
			grid-template-columns: repeat(5, minmax(190px, 1fr));
			gap: 18px;
			align-items: stretch;
		}
		.rank-card {
			position: relative;
			overflow: hidden;
			border: 1px solid rgba(114, 178, 209, 0.42);
			background:
				linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0)),
				rgba(35, 49, 68, 0.82);
			box-shadow:
				inset 0 1px 0 rgba(255, 255, 255, 0.09),
				0 18px 38px rgba(0, 0, 0, 0.34);
			min-height: 620px;
			text-align: center;
		}
		.rank-card:before {
			content: "";
			position: absolute;
			inset: 0;
			background-image:
				linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
				linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
			background-size: 28px 28px;
			pointer-events: none;
		}
		.rank-card-masterball {
			border-color: rgba(178, 104, 239, 0.72);
			box-shadow:
				inset 0 1px 0 rgba(255, 255, 255, 0.1),
				0 0 34px rgba(141, 55, 201, 0.22),
				0 18px 38px rgba(0, 0, 0, 0.34);
		}
		.rank-card-champion {
			border-color: rgba(255, 219, 96, 0.78);
			background:
				linear-gradient(180deg, rgba(255, 218, 95, 0.16), rgba(255, 255, 255, 0.02) 36%, rgba(35, 49, 68, 0.9)),
				rgba(35, 49, 68, 0.82);
			box-shadow:
				inset 0 1px 0 rgba(255, 255, 255, 0.12),
				0 0 42px rgba(255, 218, 95, 0.22),
				0 18px 38px rgba(0, 0, 0, 0.34);
		}
		.rank-name {
			position: relative;
			margin: 34px 0 82px;
			font-size: 29px;
			line-height: 1;
			font-weight: bold;
			letter-spacing: 0;
			text-transform: uppercase;
			color: #f5f8ff;
			text-shadow: 0 3px 14px rgba(0, 0, 0, 0.56);
		}
		.rank-samples {
			position: relative;
			display: grid;
			gap: 82px;
			justify-items: center;
		}
		.rank-card-champion .rank-samples {
			padding-top: 104px;
		}
		.trainer.rank-sample {
			position: static;
			left: auto;
			right: auto;
			bottom: auto;
			text-align: center;
			width: 130px;
			margin: 0 auto;
		}
		.trainer.rank-sample .rankbadges {
			margin: 0 auto;
		}
		.trainer.rank-sample .rankbadge {
			transform: scale(1.86);
			transform-origin: center;
		}
		.trainer.rank-sample .rankbadge-elo {
			display: none;
		}
		.trainer.rank-sample .rankbadge .rankicon {
			background-image: url("sprites/itemicons-sheet.png?v1") !important;
		}
		.rank-card-champion .trainer.rank-sample .rankbadge {
			transform: scale(2.2);
		}
		@media (max-width: 1200px) {
			.rank-showcase {
				grid-template-columns: repeat(3, minmax(190px, 1fr));
			}
		}
	</style>
</head>
<body>
	<main class="rank-showcase">
		<section class="rank-card rank-card-pokeball">
			<h1 class="rank-name">Poke Ball</h1>
			<div class="rank-samples">
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-pokeball rankbadge-division-iii"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-pokeball"></span></span><span class="rankbadge-division">III</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-pokeball rankbadge-division-ii"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-pokeball"></span></span><span class="rankbadge-division">II</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-pokeball rankbadge-division-i"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-pokeball"></span></span><span class="rankbadge-division">I</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
			</div>
		</section>
		<section class="rank-card rank-card-greatball">
			<h1 class="rank-name">Great Ball</h1>
			<div class="rank-samples">
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-greatball rankbadge-division-iii"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-greatball"></span></span><span class="rankbadge-division">III</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-greatball rankbadge-division-ii"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-greatball"></span></span><span class="rankbadge-division">II</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-greatball rankbadge-division-i"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-greatball"></span></span><span class="rankbadge-division">I</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
			</div>
		</section>
		<section class="rank-card rank-card-ultraball">
			<h1 class="rank-name">Ultra Ball</h1>
			<div class="rank-samples">
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-ultraball rankbadge-division-iii"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-ultraball"></span></span><span class="rankbadge-division">III</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-ultraball rankbadge-division-ii"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-ultraball"></span></span><span class="rankbadge-division">II</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-ultraball rankbadge-division-i"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-ultraball"></span></span><span class="rankbadge-division">I</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
			</div>
		</section>
		<section class="rank-card rank-card-masterball">
			<h1 class="rank-name">Master Ball</h1>
			<div class="rank-samples">
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-masterball rankbadge-division-iii"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-masterball"></span></span><span class="rankbadge-division">III</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-masterball rankbadge-division-ii"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-masterball"></span></span><span class="rankbadge-division">II</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-masterball rankbadge-division-i"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-masterball"></span></span><span class="rankbadge-division">I</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
			</div>
		</section>
		<section class="rank-card rank-card-champion">
			<h1 class="rank-name">Champion</h1>
			<div class="rank-samples">
				<div class="trainer rank-sample"><span class="rankbadges"><span class="rankbadge rankbadge-champion"><span class="rankbadge-banner"><span class="rankbadge-iconframe"><span class="rankicon rankicon-champion"></span></span><span class="rankbadge-division rankbadge-division-full">#1</span></span><span class="rankbadge-elo">1000 Elo</span></span></span></div>
			</div>
		</section>
	</main>
</body>
</html>
